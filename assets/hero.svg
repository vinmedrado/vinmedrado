      <stop offset="48%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#17233b" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#334155" stroke-opacity="0.28" stroke-width="1" />
