<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Vinicius Medrado</title>
  <desc id="desc">Hero banner for the portfolio README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="1600" height="500" rx="36" fill="url(#bg)" />
  <circle cx="1320" cy="90" r="155" fill="#8b5cf6" opacity="0.24" filter="url(#blur)" />
  <circle cx="1160" cy="330" r="220" fill="#38bdf8" opacity="0.16" filter="url(#blur)" />
  <circle cx="180" cy="390" r="200" fill="#22c55e" opacity="0.12" filter="url(#blur)" />
  <path d="M0 360C260 270 400 220 600 235C820 250 980 360 1200 350C1360 342 1480 300 1600 250V500H0Z" fill="#020617" opacity="0.4" />

  <text x="88" y="120" fill="#7dd3fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="6">PORTFOLIO VIVO</text>
  <text x="88" y="215" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="74" font-weight="800">Vinicius Medrado</text>
  <text x="88" y="282" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="500">Dados, automacao e IA para produtos digitais com cara de produto de verdade.</text>

  <rect x="88" y="332" width="162" height="52" rx="26" fill="#0f172a" stroke="url(#glow)" stroke-width="2" />
  <text x="169" y="365" fill="#f8fafc" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">Dados</text>

  <rect x="262" y="332" width="196" height="52" rx="26" fill="#0f172a" stroke="url(#glow)" stroke-width="2" />
  <text x="360" y="365" fill="#f8fafc" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">Automacao</text>

  <rect x="470" y="332" width="112" height="52" rx="26" fill="#0f172a" stroke="url(#glow)" stroke-width="2" />
  <text x="526" y="365" fill="#f8fafc" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">IA</text>

  <rect x="1110" y="112" width="360" height="180" rx="28" fill="#020617" opacity="0.52" stroke="#334155" />
  <text x="1142" y="160" fill="#93c5fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">FOCO</text>
  <text x="1142" y="210" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="40" font-weight="800">Experiencias</text>
  <text x="1142" y="248" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="40" font-weight="800">claras e úteis</text>
  <text x="1142" y="282" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="500">Interface, dados e operação no mesmo fluxo.</text>
</svg>
