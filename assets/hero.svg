  <text x="1062" y="160" fill="#cbd5e1" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700">PROCESSO / DADO / DECISAO</text>
  <text x="1062" y="208" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">manual in,</text>
  <text x="1062" y="246" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">pipeline out.</text>
  <text x="1062" y="286" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Work that reads like a system, not like an image prompt.</text>

