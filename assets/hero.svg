<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Vinicius Medrado</title>
  <desc id="desc">Executive portfolio banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="58%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" rx="36" fill="url(#bg)" />
  <circle cx="1320" cy="110" r="170" fill="#94a3b8" opacity="0.10" />
  <circle cx="1120" cy="345" r="230" fill="#64748b" opacity="0.10" />
  <path d="M0 372C288 286 464 256 652 266C842 277 1006 352 1200 348C1366 344 1486 310 1600 260V500H0Z" fill="#020617" opacity="0.46" />

