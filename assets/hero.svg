  <text x="88" y="264" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Data, automation and product execution.</text>
  <text x="88" y="304" fill="#cbd5e1" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="500">Santo Andre, SP  |  GM / Stellantis  |  SaaS</text>

