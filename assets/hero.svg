  <text x="88" y="206" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="76" font-weight="800">Vinicius Medrado</text>
  <text x="88" y="272" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="29" font-weight="500">Dados, automacao e IA para produtos digitais com padrao de execucao.</text>

  <rect x="88" y="334" width="152" height="50" rx="25" fill="#0f172a" stroke="url(#line)" stroke-width="1.5" />
  <text x="164" y="366" fill="#f8fafc" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700">Strategy</text>

  <rect x="250" y="334" width="176" height="50" rx="25" fill="#0f172a" stroke="url(#line)" stroke-width="1.5" />
  <text x="338" y="366" fill="#f8fafc" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700">Engineering</text>

  <rect x="438" y="334" width="132" height="50" rx="25" fill="#0f172a" stroke="url(#line)" stroke-width="1.5" />
  <text x="504" y="366" fill="#f8fafc" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700">Delivery</text>

  <rect x="1114" y="118" width="340" height="164" rx="28" fill="#020617" opacity="0.62" stroke="#334155" />
  <text x="1144" y="160" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">FOCUS</text>
  <text x="1144" y="212" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="38" font-weight="800">Systems that</text>
  <text x="1144" y="248" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="38" font-weight="800">look finished</text>
  <text x="1144" y="284" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="500">Clareza visual, consistencia e uso real.</text>
