<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Vinicius Medrado</title>
  <desc id="desc">Editorial hero banner for the GitHub profile README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="55%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#64748b" stroke-opacity="0.14" stroke-width="1" />
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="1600" height="500" rx="32" fill="url(#bg)" />
  <rect width="1600" height="500" rx="32" fill="url(#grid)" />

  <path d="M88 84H296" stroke="#94a3b8" stroke-opacity="0.32" stroke-width="2" />
  <text x="88" y="124" fill="#94a3b8" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="4">PROFILE / 01</text>

  <text x="88" y="208" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800">Vinicius Medrado</text>
  <text x="88" y="262" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Data, automação e produto em sistemas reais.</text>
  <text x="88" y="304" fill="#cbd5e1" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="500">Santo Andre, SP  •  PL Data Analyst  •  MSX International  •  Stellantis</text>

  <rect x="88" y="344" width="112" height="40" rx="20" fill="#0b1220" stroke="#475569" stroke-width="1.4" />
  <text x="144" y="371" fill="#e2e8f0" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="700">PYTHON</text>

  <rect x="210" y="344" width="120" height="40" rx="20" fill="#0b1220" stroke="#475569" stroke-width="1.4" />
  <text x="270" y="371" fill="#e2e8f0" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="700">FASTAPI</text>

  <rect x="340" y="344" width="96" height="40" rx="20" fill="#0b1220" stroke="#475569" stroke-width="1.4" />
  <text x="388" y="371" fill="#e2e8f0" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="700">REACT</text>

  <rect x="446" y="344" width="126" height="40" rx="20" fill="#0b1220" stroke="#475569" stroke-width="1.4" />
  <text x="509" y="371" fill="#e2e8f0" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="700">POSTGRES</text>

  <rect x="1028" y="78" width="486" height="312" rx="24" fill="#020617" opacity="0.76" stroke="#334155" stroke-width="1.5" />
  <path d="M1062 124H1478" stroke="#334155" stroke-width="1.2" />
  <text x="1062" y="158" fill="#cbd5e1" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700">SYSTEM / FLOW</text>
  <text x="1062" y="212" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Inputs → APIs → Data →</text>
  <text x="1062" y="250" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Decisao → Dashboard</text>
  <text x="1062" y="290" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Produtos claros, documentados e prontos para uso real.</text>

