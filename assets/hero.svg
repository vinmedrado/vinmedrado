  <rect x="1254" y="324" width="130" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="1319" y="345" fill="#e2e8f0" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700">PRODUCT</text>
  <rect x="1392" y="324" width="102" height="32" rx="16" fill="url(#accent)" opacity="0.95" />
  <text x="1443" y="345" fill="#ffffff" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700">ENGINEER</text>

